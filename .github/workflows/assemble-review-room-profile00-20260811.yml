name: Assemble Review Room Profile00 Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-and-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: review-room-profile-00-20260811
      PART_DIR: outbound/2026-08-11/review-room-profile-00-candidate-formalization-20260811/parts
      ZIP_NAME: SHIWEI_REVIEW_ROOM_PROFILE_00_MINIMAL_COMPATIBLE_LINE_ADOPTION_PROFILE_V1_CANDIDATE_FORMALIZATION_AND_DETERMINISTIC_CLOSURE_CUMULATIVE_REVIEW_20260811_V1.zip
      EXPECTED_SHA256: E07A4828D9F6CC44AE85AF10E599BD0CAE2DD56909375E321BD86618FCE8ECF8
      EXPECTED_BYTES: "37295178"
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/$ZIP_NAME"
          cat "$PART_DIR"/part-* > "$output"
          actual_bytes="$(stat -c%s "$output")"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA256  $output" | sha256sum -c -
          python -c "import sys,zipfile; p=sys.argv[1]; z=zipfile.ZipFile(p); assert len(z.infolist()) == 33; bad=z.testzip(); assert bad is None, bad" "$output"

      - name: Publish exact ZIP release asset
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/$ZIP_NAME"
          gh release delete-asset "$TAG" "profile00-upload-probe-1m.bin" --yes --repo "$GITHUB_REPOSITORY" || true
          gh release upload "$TAG" "$output" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
